[package]
name = "openflow-windows"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenFlow's Windows client: push-to-talk dictation over openflow-core."

# Its own workspace. The root workspace is Rust-for-every-platform; this crate
# only builds on Windows and must not break `cargo build` at the repo root.
[workspace]

[lib]
name = "openflow_windows"
path = "src/lib.rs"

[[bin]]
name = "openflow"
path = "src/main.rs"

[dependencies]
openflow-core = { path = "../../crates/openflow-core" }

# UI. egui rather than Win32 controls: the settings and history surfaces are
# dynamic (download progress, live meter, per-row actions), and hand-rolling
# them against ListView would be several thousand lines with no upside.
eframe = "0.36.2"
egui = "0.36.2"
tray-icon = "0.24.2"

# Capture, inference, storage.
cpal = "0.18.2"
whisper-rs = "0.16.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
hound = "3.5.1"
rustfft = "6.4.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4.1"

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[features]
default = []
# Pass through to whisper.cpp. Both need their own SDK installed; neither is
# required, and CPU inference is the supported default.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[profile.release]
lto = true
opt-level = 3

# Only on Windows: the icon is embedded as a PE resource, which needs the
# platform's resource compiler. On any other host this section is skipped and
# `build.rs` does nothing.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
